name: Robot OSIRIS – wolne moce PSE

# Etap A (21.11.2026): tylko ręczne uruchamianie. Harmonogram (środy 05:23 UTC) dojdzie w etapie B, osobnym PR.
# Robot NIGDY nie scala – nie ma takiego kroku. Nowe dane trafiają na stronę tylko przez PR zatwierdzony przez Anię.
on:
  workflow_dispatch:
    inputs:
      tryb:
        description: "normalny – sprawdź i zgłoś; proba – wszystko bez PR/issue; wymus-pr – testowy PR; wymus-problem – testowe issue"
        type: choice
        options: [normalny, proba, wymus-pr, wymus-problem]
        default: normalny

# Domyślnie żadnych uprawnień – każde zadanie dostaje tylko to, czego potrzebuje.
permissions: {}

concurrency:
  group: robot-osiris-pse
  cancel-in-progress: false

jobs:
  sprawdz:
    name: Sprawdź PSE
    # macOS: odczyt PDF przez wbudowany PDFKit (bez instalowania narzędzi). To zadanie czyta niezaufany plik,
    # więc nie ma żadnych uprawnień ani tokena zapisu.
    runs-on: macos-15
    timeout-minutes: 10
    permissions: {}
    outputs:
      stan: ${{ steps.robot.outputs.stan }}
      stan_na: ${{ steps.robot.outputs.stan_na }}
      sha256: ${{ steps.robot.outputs.sha256 }}
    steps:
      - name: Pobierz kod repo (publiczne, bez tokena)
        run: |
          git init -q repo
          git -C repo fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C repo checkout -q FETCH_HEAD
          node --version

      - name: Testy odczytu i sprawdzianu prawdy
        working-directory: repo
        run: node --test scripts/pse-moce/testy.mjs

      - name: Robot – pobierz z pse.pl, porównaj skrót, odczytaj, sprawdź
        id: robot
        working-directory: repo
        env:
          TRYB: ${{ inputs.tryb }}
        run: |
          WYNIK="${RUNNER_TEMP}/wynik"
          case "$TRYB" in
            wymus-pr) FLAGI="--wymus --symulacja wymus-pr" ;;
            wymus-problem) FLAGI="--wymus --symuluj-problem --symulacja wymus-problem" ;;
            *) FLAGI="" ;;
          esac
          node scripts/pse-moce/robot.mjs $FLAGI --wyjscie "$WYNIK"
          pole() { node -p "require(process.argv[1])['$1'] ?? ''" "$WYNIK/wynik.json"; }
          STAN="$(pole stan)"
          {
            echo "stan=$STAN"
            echo "stan_na=$(pole stan_na)"
            echo "sha256=$(pole sha256)"
          } >> "$GITHUB_OUTPUT"
          if [ "$STAN" = "nowe-dane" ] || [ "$STAN" = "nowy-plik" ]; then cp public/data/moce-pse.json "$WYNIK/moce-pse.json"; fi
          {
            echo "## Robot OSIRIS – wynik: \`$STAN\` (tryb: $TRYB)"
            echo
            if [ "$STAN" = "bez-zmian" ]; then
              echo "Na pse.pl nie ma nowszej wersji dokumentu (ten sam SHA-256). Nic nie wysyłam."
            else
              cat "$WYNIK/opis.md"
            fi
            if [ "$TRYB" = "proba" ] && [ "$STAN" != "bez-zmian" ]; then
              echo
              echo "**Tryb próba:** robot otworzyłby teraz $([ "$STAN" = problem ] && echo 'issue' || echo 'PR') – w tym trybie nic nie wysyła."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Przekaż wynik do zadania „Zgłoś” (bez PDF)
        if: steps.robot.outputs.stan != 'bez-zmian'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wynik-robota
          path: ${{ runner.temp }}/wynik/
          if-no-files-found: error
          retention-days: 7

  potwierdz:
    # Nazwa tego zadania jest czytana przy budowaniu strony (scripts/pse-moce/sprawdzono.mjs) – nie zmieniać bez zmiany tam.
    name: Potwierdź aktualność danych
    needs: sprawdz
    if: needs.sprawdz.outputs.stan == 'bez-zmian'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Dane na stronie są aktualne
        env:
          STAN_NA: ${{ needs.sprawdz.outputs.stan_na }}
        run: |
          echo "Robot OSIRIS: na pse.pl nie ma nowszej wersji niż stan na ${STAN_NA}."

  zglos:
    name: Zgłoś (PR albo issue)
    needs: sprawdz
    if: inputs.tryb != 'proba' && (needs.sprawdz.outputs.stan == 'nowe-dane' || needs.sprawdz.outputs.stan == 'nowy-plik' || needs.sprawdz.outputs.stan == 'problem')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Tylko to, co potrzebne: gałąź (contents), PR z prośbą o przegląd (pull-requests), issue (issues).
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Odbierz wynik z zadania „Sprawdź PSE”
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wynik-robota
          path: ${{ runner.temp }}/wynik

      - name: Otwórz PR albo issue (bez scalania)
        # Logika w scripts/pse-moce/zglos.mjs (testowana: node --test scripts/pse-moce/testy.mjs).
        # „Nic do zapisania” kończy się zielono z raportem; tryb wymus-pr zawsze daje PR (plik-znacznik testu).
        env:
          GH_TOKEN: ${{ github.token }}
          TRYB: ${{ inputs.tryb }}
          RECENZENT: ${{ github.repository_owner }}
        run: |
          gh auth setup-git
          git clone -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" repo
          node repo/scripts/pse-moce/zglos.mjs --wynik "${RUNNER_TEMP}/wynik" --repo repo --tryb "$TRYB"
