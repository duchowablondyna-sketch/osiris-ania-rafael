name: Odśwież stronę

on:
  schedule:
    - cron: "30 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  odswiez:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Wywołaj Cloudflare Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: curl -fsS --max-time 60 -X POST "$DEPLOY_HOOK" -o /dev/null
